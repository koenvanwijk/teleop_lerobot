name: Syntax check

on:
  push:
    branches: [main, lerobot-0.6.1-degrees]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile webserver.py teleoperation_manager.py blockly_manager.py network_manager.py
      - name: WiFi parser smoke test
        run: |
          python - <<'PY'
          from network_manager import NetworkManager

          assert NetworkManager._split_nmcli_terse(r'My\:WiFi:87:WPA2') == ['My:WiFi', '87', 'WPA2']
          assert NetworkManager._split_nmcli_terse(r'Office:65:WPA2 WPA3') == ['Office', '65', 'WPA2 WPA3']
          print("WiFi parser OK")
          PY

      - name: Hardware mapping uniqueness
        run: |
          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          path = Path("mapping.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          required = {"SERIAL_SHORT", "NICE_NAME", "ROLE", "TYPE"}
          if not rows:
              raise SystemExit("mapping.csv contains no device mappings")

          missing_columns = required - set(rows[0])
          if missing_columns:
              raise SystemExit(f"mapping.csv missing columns: {sorted(missing_columns)}")

          by_serial = defaultdict(list)
          for line_no, row in enumerate(rows, start=2):
              serial = (row.get("SERIAL_SHORT") or "").strip()
              if not serial:
                  raise SystemExit(f"mapping.csv line {line_no}: empty SERIAL_SHORT")
              by_serial[serial].append((line_no, row))

          duplicates = {
              serial: entries
              for serial, entries in by_serial.items()
              if len(entries) > 1
          }

          if duplicates:
              details = []
              for serial, entries in sorted(duplicates.items()):
                  rendered = ", ".join(
                      f"line {line_no} ({row['NICE_NAME']}/{row['ROLE']}/{row['TYPE']})"
                      for line_no, row in entries
                  )
                  details.append(f"{serial}: {rendered}")
              raise SystemExit(
                  "Duplicate SERIAL_SHORT values in mapping.csv:\n"
                  + "\n".join(details)
              )

          print(f"mapping.csv OK: {len(rows)} unique hardware IDs")
          PY

      - name: Translation completeness
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def flatten(obj, prefix=""):
              out = {}
              for key, value in obj.items():
                  full = f"{prefix}.{key}" if prefix else key
                  if isinstance(value, dict):
                      out.update(flatten(value, full))
                  else:
                      out[full] = value
              return out

          nl = flatten(json.loads(Path("static/i18n/nl.json").read_text()))
          en = flatten(json.loads(Path("static/i18n/en.json").read_text()))

          if set(nl) != set(en):
              missing_nl = sorted(set(en) - set(nl))
              missing_en = sorted(set(nl) - set(en))
              raise SystemExit(f"Translation key mismatch. Missing NL={missing_nl}; missing EN={missing_en}")

          html = Path("templates/index.html").read_text()
          raw_values = re.findall(r'data-i18n="([^"]+)"', html)
          used = {
              value.split("]", 1)[1] if value.startswith("[") and "]" in value else value
              for value in raw_values
          }
          missing = sorted(key for key in used if key not in nl or key not in en)
          if missing:
              raise SystemExit(f"Missing translations for GUI keys: {missing}")

          print(f"Translation keys OK: {len(nl)} keys, {len(used)} used by index.html")
          PY

      - name: Browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          for source in ("templates/index.html", "templates/robot_viewer.html", "templates/ssh_terminal.html"):
              html = Path(source).read_text()
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
              inline = "\n".join(script for script in scripts if script.strip())
              target = Path("/tmp") / (Path(source).stem + ".js")
              target.write_text(inline)
              print(target)
          PY
          node --check /tmp/index.js
          node --check /tmp/robot_viewer.js
          node --check /tmp/ssh_terminal.js
      - name: Installer syntax
        run: bash -n install.sh
